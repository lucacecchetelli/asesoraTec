<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear contraseña | AsesoraTec</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .pin-row { display:flex; gap:12px; justify-content:center; margin:24px 0 8px; }
        .pin-digit {
            width:52px; height:64px; text-align:center; font-size:1.6rem; font-weight:700;
            background:#1e2330; border:2px solid #2a2f3d; border-radius:12px;
            color:#e2e8f0; outline:none; caret-color:transparent; letter-spacing:0;
            transition:border-color .2s;
        }
        .pin-digit:focus { border-color:#3b82f6; }
        .pin-digit.filled { border-color:#475569; }
        .pin-digit.error { border-color:#f87171; }
        .pin-rules { list-style:none; padding:0; margin:8px 0 0; }
        .pin-rules li { font-size:.8rem; padding:3px 0; display:flex; align-items:center; gap:6px; color:#64748b; transition:color .2s; }
        .pin-rules li.pass { color:#4ade80; }
        .pin-rules li.fail { color:#f87171; }
        .pin-rules li::before { content:'○'; font-size:.7rem; }
        .pin-rules li.pass::before { content:'✓'; }
        .pin-rules li.fail::before { content:'✗'; }
        .submit-btn {
            width:100%; padding:13px; margin-top:20px; border:none; border-radius:10px;
            background:#3b82f6; color:#fff; font-size:.95rem; font-weight:600;
            cursor:pointer; transition:opacity .2s;
        }
        .submit-btn:disabled { opacity:.4; cursor:not-allowed; }
        .status-msg { text-align:center; font-size:.85rem; margin-top:12px; min-height:20px; }
        .status-msg.error { color:#f87171; }
        .status-msg.success { color:#4ade80; }
    </style>
</head>
<body>
    <header class="header">
        <h2 style="color:#e2e8f0; margin:0;">AsesoraTec</h2>
    </header>

    <main class="main">
        <div class="login-box" style="max-width:400px;">
            <h1 class="login-title" style="font-size:1.3rem; margin-bottom:6px;">Crea tu contraseña</h1>
            <p style="color:#64748b; font-size:.875rem; text-align:center; margin:0 0 4px;">
                Es la primera vez que ingresas. Establece un PIN de 5 dígitos para proteger tu cuenta.
            </p>

            <div class="pin-row" id="pinRow">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
                <input type="text" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
            </div>

            <ul class="pin-rules" id="pinRules">
                <li id="rule-digits">5 dígitos numéricos</li>
                <li id="rule-unique">Sin dígitos repetidos</li>
                <li id="rule-seq">Sin secuencias consecutivas (ej. 12345)</li>
            </ul>

            <button class="submit-btn" id="submitBtn" disabled>Guardar contraseña</button>
            <p class="status-msg" id="statusMsg"></p>
        </div>
    </main>

    <script>

        const boxes   = Array.from(document.querySelectorAll('.pin-digit'));
        const submit  = document.getElementById('submitBtn');
        const msgEl   = document.getElementById('statusMsg');
        const rDigits = document.getElementById('rule-digits');
        const rUnique = document.getElementById('rule-unique');
        const rSeq    = document.getElementById('rule-seq');

        function getPin() { return boxes.map(b => b.value).join(''); }

        function validate(pin) {
            const allDigits = /^\d{5}$/.test(pin);
            const allUnique = allDigits && new Set(pin.split('')).size === 5;
            const digits    = pin.split('').map(Number);
            const isAsc     = digits.length === 5 && digits.every((n, i) => i === 0 || n === digits[i-1] + 1);
            const isDesc    = digits.length === 5 && digits.every((n, i) => i === 0 || n === digits[i-1] - 1);
            const notSeq    = allDigits && !isAsc && !isDesc;
            return { allDigits, allUnique, notSeq, valid: allDigits && allUnique && notSeq };
        }

        function setRule(el, state) {
            el.className = state === true ? 'pass' : state === false ? 'fail' : '';
        }

        function updateUI() {
            const pin = getPin();
            const len = pin.length;
            const { allDigits, allUnique, notSeq, valid } = validate(pin);

            setRule(rDigits, len === 0 ? '' : allDigits ? true : false);
            setRule(rUnique, len < 2 ? '' : allUnique ? true : false);
            setRule(rSeq,    len < 5 ? '' : notSeq ? true : false);

            submit.disabled = !valid;
            boxes.forEach((b, i) => {
                b.classList.toggle('filled', !!b.value);
                b.classList.remove('error');
            });
        }

        boxes.forEach((box, i) => {
            box.addEventListener('keydown', e => {
                if (e.key === 'Backspace') {
                    if (box.value) { box.value = ''; updateUI(); }
                    else if (i > 0) { boxes[i-1].focus(); boxes[i-1].value = ''; updateUI(); }
                    e.preventDefault();
                }
                if (e.key === 'ArrowLeft' && i > 0) boxes[i-1].focus();
                if (e.key === 'ArrowRight' && i < 4) boxes[i+1].focus();
            });
            box.addEventListener('input', () => {
                const val = box.value.replace(/\D/g, '').slice(-1);
                box.value = val;
                if (val && i < 4) boxes[i+1].focus();
                updateUI();
            });
            box.addEventListener('paste', e => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 5);
                pasted.split('').forEach((ch, j) => { if (boxes[j]) boxes[j].value = ch; });
                boxes[Math.min(pasted.length, 4)].focus();
                updateUI();
            });
        });

        submit.addEventListener('click', async () => {
            const pin = getPin();
            submit.disabled = true;
            msgEl.className = 'status-msg';
            msgEl.textContent = 'Guardando…';

            try {
                const res  = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pin })
                });
                const data = await res.json();
                if (data.success) {
                    msgEl.className = 'status-msg success';
                    msgEl.textContent = '¡Contraseña guardada! Redirigiendo…';
                    setTimeout(() => window.location.href = data.redirect, 900);
                } else {
                    msgEl.className = 'status-msg error';
                    msgEl.textContent = data.error || 'Error al guardar';
                    boxes.forEach(b => b.classList.add('error'));
                    submit.disabled = false;
                }
            } catch {
                msgEl.className = 'status-msg error';
                msgEl.textContent = 'Error de conexión';
                submit.disabled = false;
            }
        });

        boxes[0].focus();
    </script>
</body>
</html>
