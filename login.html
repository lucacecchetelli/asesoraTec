<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | AsesoraTec</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">
        <img src="logo-tec.png" alt="Tecnológico de Monterrey"/>
    </header>


    <main class="main">
        <div class="login-box">
            <div class="login-logo">
            <img src="asesoratec.png" alt="asesoratec" width="250" height=/>
            </div>

            <h1 class="login-title">AsesoraTec</h1>

            <form id="loginForm">
                <div class="input-group">
                    <input
                        id="userId"
                        type="text"
                        placeholder="Usuario"
                        autocomplete="username"
                        required
                    />
                </div>

                <div class="input-group">
                    <input
                        id="password"
                        type="password"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    />
                </div>

                <button type="submit" class="login-btn">
                    Ingresar
                </button>

                <p id="error" class="error-text"></p>
            </form>

            <script src="login.js"></script>

            <div class="links">
                <a href="#" onclick="recoverPassword()">¿Olvidaste tu contraseña?</a>
                <a href="set-password.html">Crear cuenta</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div>
            <a href="#">Aviso de privacidad</a> · <a href="#">Ethos</a>
        </div>
        <div>
            © 2026 Tecnológico de Monterrey
        </div>
    </footer>

    <script>
        async function recoverPassword() {
            const identificador = prompt("Ingresa tu nómina o matrícula (ej. A0... o L0...):");
            if (!identificador) return;

            try {
                const response = await fetch('/api/recover-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identificador })
                });
                const data = await response.json();

                if (!data.success) {
                    alert(data.error || "Error al solicitar la recuperación.");
                    return;
                }

                const pin = prompt("Te hemos enviado un código a tu correo. Ingrésalo aquí:");
                if (!pin) return;

                const newPassword = prompt("Ingresa tu nueva contraseña (5 dígitos numéricos sin repeticiones):");
                if (!newPassword) return;

                const resetResponse = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin, newPassword })
                });
                const resetData = await resetResponse.json();

                if (resetData.success) {
                    alert("¡Contraseña cambiada exitosamente! Ya puedes iniciar sesión.");
                } else {
                    alert(resetData.error || "Error al cambiar la contraseña.");
                }

            } catch (error) {
                console.error(error);
                alert("Error de conexión con el servidor. Intenta nuevamente.");
            }
        }
    </script>

</body>
</html>
